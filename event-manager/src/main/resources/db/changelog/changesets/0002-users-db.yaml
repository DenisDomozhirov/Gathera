databaseChangeLog:
  - changeSet:
      id: 1
      author: your_username

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: login
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: user_age
                  type: integer
                  constraints:
                    nullable: true

              - column:
                  name: role
                  type: varchar(255)
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: users