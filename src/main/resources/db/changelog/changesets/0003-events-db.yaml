databaseChangeLog:
  - changeSet:
      id: 1
      author: your_username

      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: start_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: duration_minutes
                  type: integer
                  constraints:
                    nullable: false

              - column:
                  name: max_places
                  type: integer
                  constraints:
                    nullable: false

              - column:
                  name: occupied_places
                  type: integer
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: cost
                  type: NUMERIC(10,2)

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: location_id
            referencedTableName: locations
            referencedColumnNames: id
            constraintName: fk_events_location
        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_events_owner
        - createIndex:
            tableName: events
            indexName: idx_events_status_start_at
            columns:
              - column: {name: status}
              - column: {name: start_at}

      rollback:
        - dropTable:
            tableName: events