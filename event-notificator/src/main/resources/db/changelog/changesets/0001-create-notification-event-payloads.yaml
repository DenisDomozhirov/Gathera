databaseChangeLog:
  - changeSet:
      id: 0001-create-notification-event-payloads
      author: gathera
      changes:
        - createTable:
            tableName: notification_event_payloads
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: event_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
              - column:
                  name: changed_by_id
                  type: BIGINT
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false