databaseChangeLog:
  - changeSet:
      id: 0002-create-notifications
      author: gathera
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: payload_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
              baseTableName: notifications
              baseColumnNames: payload_id
              referencedTableName: notification_event_payloads
              referencedColumnNames: id
              constraintName: fk_notifications_payload