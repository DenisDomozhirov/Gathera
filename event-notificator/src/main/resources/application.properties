spring.application.name=event-notificator
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5441/postgres
spring.datasource.username=postgres
spring.datasource.password=new_password_for_db_notificator

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/changelog-master.yaml

jwt.secret-key=d8a7e2c5f9b1e4d3f7a6b4c9d0e1k2a7n4c5d6e7f8a9b0c1d2e3f4a0k7n5v8e5g1

notifications.retention-days=7
notifications.cleanup.cron=0 0 3 * * *


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=event-notificator
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gathera.common.kafka